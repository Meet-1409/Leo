{% extends "public.html" %}{% block title %}Contact Leo{% endblock %}{% block content %}<section class="hero" style="padding-bottom:32px"><p class="eye">Contact us</p><h1>Talk to a person.</h1><p class="lead">Questions about hiring with Leo, partnerships or press. Tell us what you need, and we'll reply by email.</p></section>
<section class="sec"><h2 class="side-title">Send a message</h2><form method="post" class="body" style="max-width:640px">{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="cards"><label class="field"><span>Your name</span><input class="input" name="name"></label><label class="field"><span>Your email</span><input class="input" type="email" name="email" required></label></div><label class="field"><span>Topic</span><select class="input" name="topic">{% for t in topics %}<option>{{ t }}</option>{% endfor %}</select></label><label class="field"><span>Message</span><textarea class="input" name="message" required minlength="10"></textarea></label><button class="btn">Send message</button></form></section>{% endblock %}
