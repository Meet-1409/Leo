<p class="soft" style="margin-bottom:12px">{% if user.password_hash %}You can log in with this password or an email code.{% else %}Set a password to log in without waiting for an email code.{% endif %}</p>
<form method="post" action="/me/set-password"><input type="hidden" name="next" value="{{ action_next }}">
<label class="field"><span>New password <span class="soft">(at least 8 characters)</span></span><input class="input" type="password" name="password" minlength="8" required autocomplete="new-password"></label>
<label class="field"><span>Confirm password</span><input class="input" type="password" name="confirm" minlength="8" required autocomplete="new-password"></label>
<button class="btn">{{ "Change password" if user.password_hash else "Set password" }}</button></form>
{% if user.password_hash %}<form method="post" action="/me/clear-password" style="margin-top:10px"><input type="hidden" name="next" value="{{ action_next }}"><button class="linkbtn">Remove password</button></form>{% endif %}
